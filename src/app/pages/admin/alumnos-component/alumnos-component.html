<div class="alumnos-container">
  <div class="module-code">{{ rutaActual }} · RF-03 / RF-04 / RF-05</div>

  <div class="header">
    <h1>Alumnos</h1>
  </div>

  <div class="toolbar">
    <input
      class="input-buscar"
      type="text"
      placeholder="Buscar por nombre o matrícula"
      [(ngModel)]="busqueda"
    />

    <select class="input-select" [(ngModel)]="grupoSeleccionado">
      <option value="">Todos los grupos</option>
      <option *ngFor="let grupo of grupos" [value]="grupo">
        {{ grupo }}
      </option>
    
    </select>

    <button class="btn-nuevo" (click)="abrirModalNuevo()">
      Nuevo alumno
    </button>
  </div>

  <table class="alumnos-table">
    <thead>
      <tr>
        <th>Matrícula</th>
        <th>Nombre</th>
        <th>Grupo</th>
        <th>Tutor</th>
        <th>Alergias</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
  <tr *ngFor="let alumno of alumnosFiltrados">

    <td>{{ alumno.matricula }}</td>
    <td>{{ alumno.nombre }}</td>
    <td>{{ alumno.grupo }}</td>
    <td>{{ alumno.tutor }}</td>
    <td>{{ alumno.alergias || '—' }}</td>

    <td>
      <button (click)="abrirModalEditar(alumno)">Editar</button>
      <button (click)="darDeBaja(alumno)">Dar de baja</button>
    </td>

  </tr>
</tbody>
  </table>

  <div class="estado-vacio" *ngIf="alumnosFiltrados.length === 0">
    <strong>Sin resultados</strong>
    Ningún alumno coincide con tu búsqueda.
  </div>
</div>

<app-modal-agregar-alumno
  [isVisible]="mostrarModal"
  [alumno]="alumnoEditando"
  (onClose)="cerrarModal()"
  (onSave)="guardarAlumno($event)"
></app-modal-agregar-alumno>
